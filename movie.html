
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080a0f">

  <meta name="description" content="Explore movie details, ratings, descriptions and viewing options on CineVault.">
  <meta name="robots" content="index, follow">

  <title>Movie Details | CineVault</title>

  <!-- Technical SEO -->
  <link id="canonicalUrl" rel="canonical"
        href="https://cinevault.movie24.workers.dev/movie.html">

  <meta property="og:site_name" content="CineVault">
  <meta property="og:type" content="website">
  <meta property="og:url"
        content="https://cinevault.movie24.workers.dev/movie.html">
  <meta property="og:title" content="Movie Details | CineVault">
  <meta property="og:description"
        content="Explore movie details and information on CineVault.">
  <meta property="og:image"
        content="https://cinevault.movie24.workers.dev/favicon.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Movie Details | CineVault">
  <meta name="twitter:description"
        content="Explore movie details and information on CineVault.">
  <meta name="twitter:image"
        content="https://cinevault.movie24.workers.dev/favicon.png">

  <link rel="stylesheet" href="style.css">

  <style>
    .movie-details-page {
      min-height: 70vh;
      padding-bottom: 70px;
    }

    .movie-backdrop {
      min-height: 430px;
      position: relative;
      display: flex;
      align-items: end;
      padding: 55px 6%;
      background-color: #080a0f;
      background-size: cover;
      background-position: center;
    }

    .movie-detail-heading {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .movie-detail-heading h1 {
      font-size: clamp(32px, 5vw, 58px);
      margin: 12px 0;
      color: #fff;
      overflow-wrap: anywhere;
    }

    .movie-detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 22px;
      color: #ddd;
      margin: 15px 0 24px;
    }

    .movie-detail-meta span {
      color: #d6b36a;
    }

    .movie-detail-layout {
      max-width: 1200px;
      margin: 45px auto;
      padding: 0 6%;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 42px;
    }

    .movie-detail-poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: 12px;
      object-fit: cover;
      background: #171a20;
      box-shadow: 0 12px 35px rgba(0,0,0,.4);
    }

    .movie-detail-info h2,
    .similar-movies h2 {
      color: #d6b36a;
      margin: 0 0 18px;
    }

    .movie-detail-description {
      color: #c4c4c4;
      line-height: 1.9;
      margin-bottom: 25px;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .movie-info-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin: 25px 0;
    }

    .movie-info-item {
      background: #11151d;
      padding: 15px;
      border: 1px solid rgba(214,179,106,.13);
      border-radius: 9px;
      min-width: 0;
    }

    .movie-info-item small {
      display: block;
      color: #999;
      margin-bottom: 6px;
    }

    .movie-info-item strong {
      color: #eee;
      overflow-wrap: anywhere;
    }

    .movie-action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 28px;
    }

    .movie-action-buttons a,
    .movie-action-buttons button {
      display: inline-block;
      text-decoration: none;
      padding: 14px 25px;
      border-radius: 7px;
      font-weight: 700;
      text-align: center;
      transition: .2s;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .watch-button {
      background: #d6b36a;
      color: #080a0f;
      border: 1px solid #d6b36a;
    }

    .download-button {
      background: transparent;
      border: 1px solid #d6b36a;
      color: #d6b36a;
    }

    .movie-action-buttons a:hover,
    .movie-action-buttons button:hover {
      transform: translateY(-3px);
      opacity: .9;
    }

    .movie-unavailable {
      color: #aaa;
      margin-top: 18px;
      font-size: 14px;
    }

    .similar-movies {
      max-width: 1200px;
      margin: 55px auto 0;
      padding: 0 6%;
    }

    .similar-movies-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 18px;
    }

    .similar-movie-card {
      color: #fff;
      text-decoration: none;
      min-width: 0;
    }

    .similar-movie-card img {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: 8px;
      background: #171a20;
    }

    .similar-movie-card h3 {
      font-size: 14px;
      margin: 9px 0 4px;
      overflow-wrap: anywhere;
    }

    .similar-movie-card p {
      color: #aaa;
      font-size: 12px;
    }

    .movie-error {
      max-width: 700px;
      margin: 100px auto;
      padding: 30px;
      text-align: center;
    }

    .movie-error h1 {
      color: #d6b36a;
    }

    .movie-error a {
      color: #d6b36a;
    }

    /* ADVERTISEMENT GATE */

    .cv-ad-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, .86);
      backdrop-filter: blur(7px);
    }

    .cv-ad-overlay.active {
      display: flex;
    }

    .cv-ad-modal {
      width: 100%;
      max-width: 460px;
      position: relative;
      background: #10141d;
      border: 1px solid rgba(214,179,106,.45);
      border-radius: 15px;
      padding: 30px 25px;
      box-shadow: 0 20px 70px rgba(0,0,0,.65);
      text-align: center;
      animation: cvModalIn .22s ease;
    }

    @keyframes cvModalIn {
      from {
        opacity: 0;
        transform: translateY(15px) scale(.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .cv-ad-close {
      position: absolute;
      right: 13px;
      top: 10px;
      border: none;
      background: transparent;
      color: #aaa;
      font-size: 26px;
      cursor: pointer;
      line-height: 1;
    }

    .cv-ad-close:hover {
      color: #fff;
    }

    .cv-ad-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(214,179,106,.12);
      color: #d6b36a;
      font-size: 27px;
    }

    .cv-ad-modal h2 {
      color: #d6b36a;
      font-size: 23px;
      margin: 0 0 10px;
    }

    .cv-ad-description {
      color: #bbb;
      font-size: 14px;
      line-height: 1.7;
      margin: 0 0 20px;
    }

    .cv-ad-progress-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: #ddd;
      font-size: 13px;
      margin-bottom: 9px;
    }

    .cv-ad-progress-track {
      width: 100%;
      height: 9px;
      overflow: hidden;
      border-radius: 20px;
      background: #252b36;
      margin-bottom: 22px;
    }

    .cv-ad-progress-fill {
      width: 0;
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(90deg, #a9823d, #e9ca82);
      transition: width .25s ease;
    }

    .cv-ad-visit,
    .cv-ad-continue {
      width: 100%;
      min-height: 48px;
      padding: 13px 18px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
      font-family: inherit;
    }

    .cv-ad-visit {
      border: 1px solid #d6b36a;
      background: #d6b36a;
      color: #080a0f;
    }

    .cv-ad-continue {
      margin-top: 11px;
      border: 1px solid #d6b36a;
      background: transparent;
      color: #d6b36a;
    }

    .cv-ad-visit:hover,
    .cv-ad-continue:not(:disabled):hover {
      opacity: .88;
      transform: translateY(-2px);
    }

    .cv-ad-continue:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .cv-ad-status {
      min-height: 22px;
      color: #d6b36a;
      font-size: 12px;
      line-height: 1.6;
      margin: 13px 0 0;
    }

    .cv-ad-note {
      color: #777;
      font-size: 11px;
      line-height: 1.6;
      margin: 14px 0 0;
    }

    .cv-ad-no-url {
      color: #ff9999;
      font-size: 13px;
      line-height: 1.6;
      margin: 12px 0 0;
    }

    @media (max-width: 900px) {
      .similar-movies-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .movie-backdrop {
        min-height: 330px;
        padding: 35px 5%;
      }

      .movie-detail-layout {
        grid-template-columns: 1fr;
        gap: 25px;
        margin-top: 30px;
      }

      .movie-detail-poster {
        max-width: 220px;
        margin: 0 auto;
      }

      .movie-info-list {
        grid-template-columns: 1fr 1fr;
      }

      .similar-movies-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .movie-action-buttons a,
      .movie-action-buttons button {
        flex: 1 1 130px;
      }

      .cv-ad-modal {
        padding: 28px 19px 22px;
      }
    }

    @media (max-width: 380px) {
      .movie-info-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <a class="brand"
     href="index.html"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="CineVault Home">
    <span class="brand-mark">C</span>
    <span>CINE<span>VAULT</span></span>
  </a>

  <a class="header-cta"
     href="index.html"
     target="_blank"
     rel="noopener noreferrer">
    Back to CineVault ↗
  </a>
</header>

<!-- Loading Movie text removed. -->
<main id="movieDetails" class="movie-details-page"></main>

<footer class="site-footer">
  <div class="footer-bottom">
    <span>© <span id="year"></span> CineVault</span>

    <div class="footer-links">
      <a href="about.html" target="_blank" rel="noopener noreferrer">About</a>
      <a href="privacy.html" target="_blank" rel="noopener noreferrer">Privacy</a>
      <a href="terms.html" target="_blank" rel="noopener noreferrer">Terms</a>
    </div>
  </div>
</footer>

<script>
(function () {
  "use strict";

  const container = document.getElementById("movieDetails");

  document.getElementById("year").textContent =
    new Date().getFullYear();

  const params = new URLSearchParams(window.location.search);

  const requestedId = params.get("id");
  const requestedSlug = params.get("title");

  /*
    TECHNICAL SEO:
    Set a canonical URL for the requested movie.
  */

  const canonicalElement = document.getElementById("canonicalUrl");
  const ogUrlElement = document.querySelector('meta[property="og:url"]');

  if (canonicalElement) {
    const canonicalUrl = new URL(
      window.location.pathname,
      window.location.origin
    );

    if (requestedId) {
      canonicalUrl.searchParams.set("id", requestedId);
    } else if (requestedSlug) {
      canonicalUrl.searchParams.set("title", requestedSlug);
    }

    canonicalElement.href = canonicalUrl.href;

    if (ogUrlElement) {
      ogUrlElement.content = canonicalUrl.href;
    }
  }

  let activeDownload = null;
  let currentMovie = null;

  const memoryProgress = Object.create(null);

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, function (char) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char];
    });
  }

  function validURL(value) {
    if (!value) return "";

    try {
      const parsed = new URL(String(value).trim());

      if (!["https:", "http:"].includes(parsed.protocol)) {
        return "";
      }

      return parsed.href;
    } catch {
      return "";
    }
  }

  function validImage(value) {
    return validURL(value);
  }

  function openNewTab(url) {
    const safeUrl = validURL(url);

    if (!safeUrl) return null;

    const newWindow = window.open(safeUrl, "_blank");

    if (newWindow) {
      try {
        newWindow.opener = null;
      } catch {
        // Ignore cross-origin opener restrictions.
      }
    }

    return newWindow;
  }

  function fallbackArtwork(title) {
    const safeTitle = escapeHTML(title || "CineVault");

    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg"
           width="500" height="750">
        <rect width="100%" height="100%" fill="#11151d"/>
        <text x="50%" y="47%"
              fill="#d6b36a"
              font-size="30"
              text-anchor="middle"
              font-family="Arial">CINEVAULT</text>
        <text x="50%" y="55%"
              fill="#ffffff"
              font-size="22"
              text-anchor="middle"
              font-family="Arial">${safeTitle}</text>
      </svg>
    `;

    return "data:image/svg+xml;charset=UTF-8," +
      encodeURIComponent(svg);
  }

  function normalizeMovie(movie) {
    const rawAdCount = Number(
      movie.adCount ?? movie.ad_count ?? 4
    );

    return {
      ...movie,

      id: movie.id,
      title: movie.title || "Untitled Movie",
      poster: movie.poster || "",
      backdrop: movie.backdrop || "",
      description: movie.description || "",

      year: movie.year || "",
      genre: movie.genre || "",
      rating: movie.rating ?? "",
      duration: movie.duration || "",
      language: movie.language || "",
      country: movie.country || "",
      director: movie.director || "",
      quality: movie.quality || "",

      watchUrl: movie.watchUrl || movie.watch_url || "",

      downloadUrl:
        movie.downloadUrl || movie.download_url || "",

      downloadUrl2:
        movie.downloadUrl2 || movie.download_url_2 || "",

      adUrl: validURL(movie.adUrl || movie.ad_url || ""),

      adCount: Number.isFinite(rawAdCount)
        ? Math.max(4, Math.min(1000, Math.floor(rawAdCount)))
        : 4
    };
  }

  function createInfoItem(label, value) {
    return `
      <div class="movie-info-item">
        <small>${escapeHTML(label)}</small>
        <strong>${escapeHTML(value || "N/A")}</strong>
      </div>
    `;
  }

  function createMovieCard(movie) {
    const poster =
      validImage(movie.poster) ||
      fallbackArtwork(movie.title);

    return `
      <a class="similar-movie-card"
         href="movie.html?id=${encodeURIComponent(movie.id)}"
         target="_blank"
         rel="noopener noreferrer">

        <img
          src="${escapeHTML(poster)}"
          alt="${escapeHTML(movie.title)} poster"
          loading="lazy"
          data-fallback="${escapeHTML(fallbackArtwork(movie.title))}">

        <h3>${escapeHTML(movie.title)}</h3>
        <p>${escapeHTML(movie.year || "Year unavailable")}</p>
      </a>
    `;
  }

  function getProgressKey(movieId, downloadType) {
    return "cinevault_ad_progress_" +
      String(movieId) + "_" + String(downloadType);
  }

  function getAdProgress(movieId, downloadType) {
    const key = getProgressKey(movieId, downloadType);

    try {
      const value = Number(sessionStorage.getItem(key) || 0);
      return Math.max(0, Math.floor(value));
    } catch {
      return Number(memoryProgress[key] || 0);
    }
  }

  function saveAdProgress(movieId, downloadType, count) {
    const key = getProgressKey(movieId, downloadType);

    memoryProgress[key] = count;

    try {
      sessionStorage.setItem(key, String(count));
    } catch {
      // Memory fallback remains active.
    }
  }

  function clearAdProgress(movieId, downloadType) {
    const key = getProgressKey(movieId, downloadType);

    delete memoryProgress[key];

    try {
      sessionStorage.removeItem(key);
    } catch {
      // Ignore unavailable storage.
    }
  }

  function createAdModal() {
    const existing = document.getElementById("cvAdOverlay");

    if (existing) {
      existing.remove();
    }

    const overlay = document.createElement("div");

    overlay.id = "cvAdOverlay";
    overlay.className = "cv-ad-overlay";

    overlay.innerHTML = `
      <div
        class="cv-ad-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="cvAdTitle">

        <button
          type="button"
          class="cv-ad-close"
          id="cvAdClose"
          aria-label="Close advertisement dialog">
          &times;
        </button>

        <div class="cv-ad-icon">↗</div>

        <h2 id="cvAdTitle">Unlock Your Download</h2>

        <p class="cv-ad-description" id="cvAdDescription">
          Complete the advertisement steps to unlock your download.
        </p>

        <div class="cv-ad-progress-label">
          <span>Advertisement Progress</span>
          <strong id="cvAdCounter">0 / 4</strong>
        </div>

        <div
          class="cv-ad-progress-track"
          role="progressbar"
          aria-label="Advertisement progress"
          aria-valuemin="0"
          aria-valuemax="4"
          aria-valuenow="0"
          id="cvAdProgressBar">

          <div
            class="cv-ad-progress-fill"
            id="cvAdProgressFill">
          </div>
        </div>

        <button
          type="button"
          class="cv-ad-visit"
          id="cvAdVisit">
          ↗ VISIT ADVERTISEMENT
        </button>

        <button
          type="button"
          class="cv-ad-continue"
          id="cvAdContinue"
          disabled>
          ↓ CONTINUE TO DOWNLOAD
        </button>

        <p
          class="cv-ad-status"
          id="cvAdStatus"
          aria-live="polite">
        </p>

        <p class="cv-ad-note">
          Each successful advertisement tab opening counts as one step.
        </p>

      </div>
    `;

    document.body.appendChild(overlay);

    document.getElementById("cvAdClose").addEventListener(
      "click",
      closeAdModal
    );

    document.getElementById("cvAdVisit").addEventListener(
      "click",
      visitAdvertisement
    );

    document.getElementById("cvAdContinue").addEventListener(
      "click",
      continueToDownload
    );

    overlay.addEventListener("click", function (event) {
      if (event.target === overlay) {
        closeAdModal();
      }
    });

    return overlay;
  }

  function updateAdModal() {
    if (!activeDownload) return;

    const movie = activeDownload.movie;
    const type = activeDownload.type;

    const required = movie.adCount;
    const progress = getAdProgress(movie.id, type);

    const completed = Math.min(progress, required);
    const percentage = Math.min(
      100,
      (completed / required) * 100
    );

    const counter = document.getElementById("cvAdCounter");
    const fill = document.getElementById("cvAdProgressFill");
    const bar = document.getElementById("cvAdProgressBar");
    const visitButton = document.getElementById("cvAdVisit");
    const continueButton = document.getElementById("cvAdContinue");
    const status = document.getElementById("cvAdStatus");
    const description = document.getElementById("cvAdDescription");

    if (!counter || !fill || !bar || !visitButton ||
        !continueButton || !status || !description) {
      return;
    }

    counter.textContent = completed + " / " + required;
    fill.style.width = percentage + "%";

    bar.setAttribute("aria-valuemax", String(required));
    bar.setAttribute("aria-valuenow", String(completed));

    description.textContent =
      "Open the advertisement " + required +
      " times to unlock " +
      (type === "download1" ? "Download 1" : "Download 2") +
      " for " + movie.title + ".";

    const unlocked = progress >= required;

    continueButton.disabled = !unlocked;

    if (unlocked) {
      visitButton.textContent = "✓ AD STEPS COMPLETED";
      visitButton.disabled = true;

      status.textContent =
        "All advertisement steps completed. Your download is now unlocked.";

    } else {
      visitButton.disabled = false;
      visitButton.textContent = "↗ VISIT ADVERTISEMENT";

      status.textContent =
        "Complete " + (required - completed) +
        " more advertisement step(s).";
    }

    if (!movie.adUrl) {
      visitButton.disabled = true;
      continueButton.disabled = true;

      status.textContent =
        "Advertisement URL is not configured for this movie.";

      description.textContent =
        "The advertisement link has not been configured by the administrator.";

      visitButton.textContent = "ADVERTISEMENT UNAVAILABLE";
    }
  }

  function openAdModal(movie, type, downloadUrl) {
    if (!movie || !downloadUrl) return;

    activeDownload = {
      movie: movie,
      type: type,
      downloadUrl: downloadUrl
    };

    const overlay = document.getElementById("cvAdOverlay") ||
      createAdModal();

    overlay.classList.add("active");

    updateAdModal();

    const closeButton = document.getElementById("cvAdClose");

    if (closeButton) {
      closeButton.focus();
    }
  }

  function closeAdModal() {
    const overlay = document.getElementById("cvAdOverlay");

    if (overlay) {
      overlay.classList.remove("active");
    }

    activeDownload = null;
  }

  function visitAdvertisement() {
    if (!activeDownload) return;

    const movie = activeDownload.movie;
    const type = activeDownload.type;

    if (!movie.adUrl) {
      updateAdModal();
      return;
    }

    const currentProgress = getAdProgress(movie.id, type);

    if (currentProgress >= movie.adCount) {
      updateAdModal();
      return;
    }

    const adWindow = openNewTab(movie.adUrl);

    if (!adWindow) {
      document.getElementById("cvAdStatus").textContent =
        "Your browser blocked the advertisement tab. Please allow pop-ups and try again.";
      return;
    }

    const nextProgress = currentProgress + 1;

    saveAdProgress(movie.id, type, nextProgress);

    updateAdModal();
  }

  function continueToDownload() {
    if (!activeDownload) return;

    const movie = activeDownload.movie;
    const type = activeDownload.type;

    const progress = getAdProgress(movie.id, type);

    if (progress < movie.adCount) {
      updateAdModal();
      return;
    }

    const downloadUrl = activeDownload.downloadUrl;

    if (!downloadUrl) return;

    const downloadWindow = openNewTab(downloadUrl);

    if (!downloadWindow) {
      document.getElementById("cvAdStatus").textContent =
        "Your browser blocked the download tab. Please allow pop-ups and try again.";
      return;
    }

    clearAdProgress(movie.id, type);
    closeAdModal();
  }

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      closeAdModal();
    }
  });

  function renderMovie(movie, similarMovies) {
    currentMovie = movie;

    const poster =
      validImage(movie.poster) ||
      fallbackArtwork(movie.title);

    const backdrop =
      validImage(movie.backdrop) || poster;

    const watchUrl = validURL(movie.watchUrl);
    const downloadUrl = validURL(movie.downloadUrl);
    const downloadUrl2 = validURL(movie.downloadUrl2);

    document.title = movie.title + " | CineVault";

    const description = movie.description ||
      "Movie description is not available yet.";

    const buttons = [];

    if (watchUrl) {
      buttons.push(`
        <a class="watch-button"
           href="${escapeHTML(watchUrl)}"
           target="_blank"
           rel="noopener noreferrer">
          ▶ WATCH NOW
        </a>
      `);
    }

    if (downloadUrl) {
      buttons.push(`
        <button
          type="button"
          class="download-button"
          data-download-type="download1">
          ↓ DOWNLOAD 1
        </button>
      `);
    }

    if (downloadUrl2) {
      buttons.push(`
        <button
          type="button"
          class="download-button"
          data-download-type="download2">
          ↓ DOWNLOAD 2
        </button>
      `);
    }

    const similar = Array.isArray(similarMovies)
      ? similarMovies
          .filter(item => String(item.id) !== String(movie.id))
          .slice(0, 8)
          .map(normalizeMovie)
      : [];

    container.innerHTML = `
      <section class="movie-backdrop" id="movieBackdrop">
        <div class="movie-detail-heading">
          <div class="eyebrow">MOVIE DETAILS</div>

          <h1>${escapeHTML(movie.title)}</h1>

          <div class="movie-detail-meta">
            <span>★ ${escapeHTML(movie.rating || "N/A")}</span>
            <span>${escapeHTML(movie.year || "Year unavailable")}</span>
            <span>${escapeHTML(movie.genre || "Genre unavailable")}</span>
            <span>${escapeHTML(movie.duration || "Duration unavailable")}</span>
          </div>
        </div>
      </section>

      <section class="movie-detail-layout">

        <div>
          <img
            class="movie-detail-poster"
            id="mainMoviePoster"
            src="${escapeHTML(poster)}"
            alt="${escapeHTML(movie.title)} poster">
        </div>

        <div class="movie-detail-info">

          <h2>About the Movie</h2>

          <p class="movie-detail-description">${escapeHTML(description)}</p>

          <div class="movie-info-list">
            ${createInfoItem("Release Year", movie.year)}
            ${createInfoItem("Genre", movie.genre)}
            ${createInfoItem("Language", movie.language)}
            ${createInfoItem("Country", movie.country)}
            ${createInfoItem("Director", movie.director)}
            ${createInfoItem("Duration", movie.duration)}
            ${createInfoItem("Quality", movie.quality)}
            ${createInfoItem("Rating", movie.rating)}
          </div>

          ${
            buttons.length
              ? `<div class="movie-action-buttons">${buttons.join("")}</div>`
              : `<p class="movie-unavailable">
                   Viewing and download links have not been added
                   for this movie yet.
                 </p>`
          }

        </div>
      </section>

      ${
        similar.length
          ? `
            <section class="similar-movies">
              <h2>Similar Movies</h2>

              <div class="similar-movies-grid">
                ${similar.map(createMovieCard).join("")}
              </div>
            </section>
          `
          : ""
      }
    `;

    createAdModal();

    // Download button event delegation.
    container.onclick = function (event) {
      const button = event.target.closest(
        "[data-download-type]"
      );

      if (!button) return;

      const type = button.dataset.downloadType;

      let targetUrl = "";

      if (type === "download1") {
        targetUrl = downloadUrl;
      }

      if (type === "download2") {
        targetUrl = downloadUrl2;
      }

      if (!targetUrl) return;

      openAdModal(movie, type, targetUrl);
    };

    const backdropElement =
      document.getElementById("movieBackdrop");

    if (backdropElement) {
      const safeBackdrop = backdrop.replace(
        /["\\\n\r]/g,
        "\\$&"
      );

      backdropElement.style.backgroundImage = `
        linear-gradient(
          0deg,
          #080a0f 5%,
          rgba(8,10,15,.55) 65%,
          rgba(8,10,15,.25)
        ),
        url("${safeBackdrop}")
      `;
    }

    const mainPoster =
      document.getElementById("mainMoviePoster");

    if (mainPoster) {
      mainPoster.addEventListener("error", function () {
        this.src = fallbackArtwork(movie.title);
      }, { once: true });
    }

    container.querySelectorAll("img[data-fallback]").forEach(img => {
      img.addEventListener("error", function () {
        this.src = this.dataset.fallback;
      }, { once: true });
    });
  }

  function showError(title, message) {
    document.title = title + " | CineVault";

    container.innerHTML = `
      <div class="movie-error">
        <h1>${escapeHTML(title)}</h1>
        <p>${escapeHTML(message)}</p>
        <p>
          <a href="index.html"
             target="_blank"
             rel="noopener noreferrer">
            ← Return to Home
          </a>
        </p>
      </div>
    `;
  }

  async function loadMovie() {
    const identifier = requestedId || requestedSlug;

    if (!identifier) {
      showError(
        "Movie Not Found",
        "No movie ID or movie title was provided."
      );
      return;
    }

    if (!/^[a-zA-Z0-9_-]+$/.test(identifier)) {
      showError(
        "Invalid Movie Link",
        "The movie address is not valid."
      );
      return;
    }

    try {
      const response = await fetch(
        "/api/movies/" + encodeURIComponent(identifier),
        {
          method: "GET",
          cache: "no-store",
          headers: {
            "Accept": "application/json"
          }
        }
      );

      if (response.status === 404) {
        showError(
          "Movie Not Found",
          "Sorry, this movie could not be found in our catalogue."
        );
        return;
      }

      if (!response.ok) {
        throw new Error("API request failed: " + response.status);
      }

      const data = await response.json();

      // Correct API response validation.
      if (!data || !data.success || !data.movie) {
        showError(
          "Movie Not Found",
          data?.message || "The requested movie could not be loaded."
        );
        return;
      }

      const movie = normalizeMovie(data.movie);

      if (movie.id === undefined || movie.id === null) {
        showError(
          "Invalid Movie Data",
          "The movie information received from the database is incomplete."
        );
        return;
      }

      const similarMovies = Array.isArray(data.similarMovies)
        ? data.similarMovies
        : [];

      renderMovie(movie, similarMovies);

    } catch (error) {
      console.error("CineVault Movie Loading Error:", error);

      showError(
        "Unable to Load Movie",
        "We could not connect to the movie database. Please refresh the page and try again."
      );
    }
  }

  // Start loading the requested movie.
  loadMovie();

})();
</script>

</body>
</html>
