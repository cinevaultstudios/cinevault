
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080a0f">

  <meta name="description" content="Explore movie details, ratings, descriptions and viewing options on CineVault.">
  <meta name="robots" content="index, follow">

  <title>Movie Details | CineVault</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .movie-details-page {
      min-height: 70vh;
      padding-bottom: 70px;
    }

    .movie-backdrop {
      min-height: 430px;
      position: relative;
      display: flex;
      align-items: end;
      padding: 55px 6%;
      background-color: #080a0f;
      background-size: cover;
      background-position: center;
    }

    .movie-detail-heading {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .movie-detail-heading h1 {
      font-size: clamp(32px, 5vw, 58px);
      margin: 12px 0;
      color: #fff;
      overflow-wrap: anywhere;
    }

    .movie-detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 22px;
      color: #ddd;
      margin: 15px 0 24px;
    }

    .movie-detail-meta span {
      color: #d6b36a;
    }

    .movie-detail-layout {
      max-width: 1200px;
      margin: 45px auto;
      padding: 0 6%;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 42px;
    }

    .movie-detail-poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: 12px;
      object-fit: cover;
      background: #171a20;
      box-shadow: 0 12px 35px rgba(0,0,0,.4);
    }

    .movie-detail-info h2,
    .similar-movies h2 {
      color: #d6b36a;
      margin: 0 0 18px;
    }

    .movie-detail-description {
      color: #c4c4c4;
      line-height: 1.9;
      margin-bottom: 25px;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .movie-info-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin: 25px 0;
    }

    .movie-info-item {
      background: #11151d;
      padding: 15px;
      border: 1px solid rgba(214,179,106,.13);
      border-radius: 9px;
      min-width: 0;
    }

    .movie-info-item small {
      display: block;
      color: #999;
      margin-bottom: 6px;
    }

    .movie-info-item strong {
      color: #eee;
      overflow-wrap: anywhere;
    }

    .movie-action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 28px;
    }

    .movie-action-buttons a {
      display: inline-block;
      text-decoration: none;
      padding: 14px 25px;
      border-radius: 7px;
      font-weight: 700;
      text-align: center;
      transition: .2s;
    }

    .watch-button {
      background: #d6b36a;
      color: #080a0f;
    }

    .download-button {
      border: 1px solid #d6b36a;
      color: #d6b36a;
    }

    .movie-action-buttons a:hover {
      transform: translateY(-3px);
      opacity: .9;
    }

    .movie-unavailable {
      color: #aaa;
      margin-top: 18px;
      font-size: 14px;
    }

    .similar-movies {
      max-width: 1200px;
      margin: 55px auto 0;
      padding: 0 6%;
    }

    .similar-movies-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 18px;
    }

    .similar-movie-card {
      color: #fff;
      text-decoration: none;
      min-width: 0;
    }

    .similar-movie-card img {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: 8px;
      background: #171a20;
    }

    .similar-movie-card h3 {
      font-size: 14px;
      margin: 9px 0 4px;
      overflow-wrap: anywhere;
    }

    .similar-movie-card p {
      color: #aaa;
      font-size: 12px;
    }

    .movie-error {
      max-width: 700px;
      margin: 100px auto;
      padding: 30px;
      text-align: center;
    }

    .movie-error h1 {
      color: #d6b36a;
    }

    .movie-error a {
      color: #d6b36a;
    }

    .movie-loading {
      color: #ccc;
      text-align: center;
      padding: 100px 20px;
    }

    @media (max-width: 900px) {
      .similar-movies-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .movie-backdrop {
        min-height: 330px;
        padding: 35px 5%;
      }

      .movie-detail-layout {
        grid-template-columns: 1fr;
        gap: 25px;
        margin-top: 30px;
      }

      .movie-detail-poster {
        max-width: 220px;
        margin: 0 auto;
      }

      .movie-info-list {
        grid-template-columns: 1fr 1fr;
      }

      .similar-movies-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .movie-action-buttons a {
        flex: 1 1 130px;
      }
    }

    @media (max-width: 380px) {
      .movie-info-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <a class="brand" href="index.html" aria-label="CineVault Home">
    <span class="brand-mark">C</span>
    <span>CINE<span>VAULT</span></span>
  </a>

  <a class="header-cta" href="index.html">Back to CineVault ↗</a>
</header>

<main id="movieDetails" class="movie-details-page">
  <div class="movie-loading">
    <h2>Loading Movie...</h2>
    <p>Please wait while we load the movie details.</p>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-bottom">
    <span>© <span id="year"></span> CineVault</span>

    <div class="footer-links">
      <a href="about.html">About</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </div>
  </div>
</footer>

<script>
(function () {
  "use strict";

  const container = document.getElementById("movieDetails");

  document.getElementById("year").textContent =
    new Date().getFullYear();

  const params = new URLSearchParams(window.location.search);

  const requestedId = params.get("id");
  const requestedSlug = params.get("title");

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, function (char) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char];
    });
  }

  function validURL(value) {
    if (!value) return "";

    try {
      const parsed = new URL(value);

      if (!["https:", "http:"].includes(parsed.protocol)) {
        return "";
      }

      return parsed.href;
    } catch {
      return "";
    }
  }

  function validImage(value) {
    return validURL(value);
  }

  function fallbackArtwork(title) {
    const safeTitle = escapeHTML(title || "CineVault");

    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg"
           width="500" height="750">
        <rect width="100%" height="100%" fill="#11151d"/>
        <text x="50%" y="47%"
              fill="#d6b36a"
              font-size="30"
              text-anchor="middle"
              font-family="Arial">CINEVAULT</text>
        <text x="50%" y="55%"
              fill="#ffffff"
              font-size="22"
              text-anchor="middle"
              font-family="Arial">${safeTitle}</text>
      </svg>
    `;

    return "data:image/svg+xml;charset=UTF-8," +
      encodeURIComponent(svg);
  }

  function normalizeMovie(movie) {
    return {
      ...movie,
      id: movie.id,
      title: movie.title || "Untitled Movie",
      poster: movie.poster || "",
      backdrop: movie.backdrop || "",
      description: movie.description || "",
      year: movie.year || "",
      genre: movie.genre || "",
      rating: movie.rating ?? "",
      duration: movie.duration || "",
      language: movie.language || "",
      country: movie.country || "",
      director: movie.director || "",
      quality: movie.quality || "",
      watchUrl: movie.watchUrl || movie.watch_url || "",
      downloadUrl: movie.downloadUrl || movie.download_url || "",
      downloadUrl2: movie.downloadUrl2 || movie.download_url_2 || ""
    };
  }

  function createInfoItem(label, value) {
    return `
      <div class="movie-info-item">
        <small>${escapeHTML(label)}</small>
        <strong>${escapeHTML(value || "N/A")}</strong>
      </div>
    `;
  }

  function createMovieCard(movie) {
    const poster =
      validImage(movie.poster) ||
      fallbackArtwork(movie.title);

    return `
      <a class="similar-movie-card"
         href="movie.html?id=${encodeURIComponent(movie.id)}">

        <img
          src="${escapeHTML(poster)}"
          alt="${escapeHTML(movie.title)} poster"
          loading="lazy"
          data-fallback="${escapeHTML(fallbackArtwork(movie.title))}">

        <h3>${escapeHTML(movie.title)}</h3>
        <p>${escapeHTML(movie.year || "Year unavailable")}</p>
      </a>
    `;
  }

  function renderMovie(movie, similarMovies) {
    const poster =
      validImage(movie.poster) ||
      fallbackArtwork(movie.title);

    const backdrop =
      validImage(movie.backdrop) || poster;

    const watchUrl = validURL(movie.watchUrl);
    const downloadUrl = validURL(movie.downloadUrl);
    const downloadUrl2 = validURL(movie.downloadUrl2);

    document.title = movie.title + " | CineVault";

    const description = movie.description ||
      "Movie description is not available yet.";

    const buttons = [];

    if (watchUrl) {
      buttons.push(`
        <a class="watch-button"
           href="${escapeHTML(watchUrl)}"
           target="_blank"
           rel="noopener noreferrer">
          ▶ WATCH NOW
        </a>
      `);
    }

    if (downloadUrl) {
      buttons.push(`
        <a class="download-button"
           href="${escapeHTML(downloadUrl)}"
           target="_blank"
           rel="noopener noreferrer">
          ↓ DOWNLOAD 1
        </a>
      `);
    }

    if (downloadUrl2) {
      buttons.push(`
        <a class="download-button"
           href="${escapeHTML(downloadUrl2)}"
           target="_blank"
           rel="noopener noreferrer">
          ↓ DOWNLOAD 2
        </a>
      `);
    }

    const similar = Array.isArray(similarMovies)
      ? similarMovies
          .filter(item => String(item.id) !== String(movie.id))
          .slice(0, 8)
          .map(normalizeMovie)
      : [];

    container.innerHTML = `
      <section class="movie-backdrop" id="movieBackdrop">
        <div class="movie-detail-heading">
          <div class="eyebrow">MOVIE DETAILS</div>

          <h1>${escapeHTML(movie.title)}</h1>

          <div class="movie-detail-meta">
            <span>★ ${escapeHTML(movie.rating || "N/A")}</span>
            <span>${escapeHTML(movie.year || "Year unavailable")}</span>
            <span>${escapeHTML(movie.genre || "Genre unavailable")}</span>
            <span>${escapeHTML(movie.duration || "Duration unavailable")}</span>
          </div>
        </div>
      </section>

      <section class="movie-detail-layout">

        <div>
          <img
            class="movie-detail-poster"
            id="mainMoviePoster"
            src="${escapeHTML(poster)}"
            alt="${escapeHTML(movie.title)} poster">
        </div>

        <div class="movie-detail-info">

          <h2>About the Movie</h2>

          <p class="movie-detail-description">
            ${escapeHTML(description)}
          </p>

          <div class="movie-info-list">
            ${createInfoItem("Release Year", movie.year)}
            ${createInfoItem("Genre", movie.genre)}
            ${createInfoItem("Language", movie.language)}
            ${createInfoItem("Country", movie.country)}
            ${createInfoItem("Director", movie.director)}
            ${createInfoItem("Duration", movie.duration)}
            ${createInfoItem("Quality", movie.quality)}
            ${createInfoItem("Rating", movie.rating)}
          </div>

          ${
            buttons.length
              ? `<div class="movie-action-buttons">${buttons.join("")}</div>`
              : `<p class="movie-unavailable">
                   Viewing and download links have not been added
                   for this movie yet.
                 </p>`
          }

        </div>
      </section>

      ${
        similar.length
          ? `
            <section class="similar-movies">
              <h2>Similar Movies</h2>

              <div class="similar-movies-grid">
                ${similar.map(createMovieCard).join("")}
              </div>
            </section>
          `
          : ""
      }
    `;

    const backdropElement =
      document.getElementById("movieBackdrop");

    if (backdropElement) {
      backdropElement.style.backgroundImage = `
        linear-gradient(
          0deg,
          #080a0f 5%,
          rgba(8,10,15,.55) 65%,
          rgba(8,10,15,.25)
        ),
        url("${backdrop.replace(/["\\]/g, "")}")
      `;
    }

    const mainPoster =
      document.getElementById("mainMoviePoster");

    if (mainPoster) {
      mainPoster.addEventListener("error", function () {
        this.src = fallbackArtwork(movie.title);
      }, { once: true });
    }

    container.querySelectorAll("img[data-fallback]").forEach(img => {
      img.addEventListener("error", function () {
        this.src = this.dataset.fallback;
      }, { once: true });
    });
  }

  function showError(title, message) {
    document.title = title + " | CineVault";

    container.innerHTML = `
      <div class="movie-error">
        <h1>${escapeHTML(title)}</h1>
        <p>${escapeHTML(message)}</p>
        <p><a href="index.html">← Return to Home</a></p>
      </div>
    `;
  }

  async function loadMovie() {
    const identifier = requestedId || requestedSlug;

    if (!identifier) {
      showError(
        "Movie Not Found",
        "No movie ID or movie title was provided."
      );
      return;
    }

    if (!/^[a-zA-Z0-9-]+$/.test(identifier)) {
      showError(
        "Invalid Movie Link",
        "The movie address is not valid."
      );
      return;
    }

    try {
      const response = await fetch(
        "/api/movies/" + encodeURIComponent(identifier),
        {
          method: "GET",
          cache: "no-store",
          headers: {
            "Accept": "application/json"
          }
        }
      );

      if (response.status === 404) {
        showError(
          "Movie Not Found",
          "Sorry, this movie could not be found in our catalogue."
        );
        return;
      }

      if (!response.ok) {
        throw new Error("API request failed: " + response.status);
      }

      const data = await response.json();

      if (!data.success || !data.movie) {
        throw new Error("Invalid movie API response.");
      }

      const movie = normalizeMovie(data.movie);

      const similarMovies = Array.isArray(data.similarMovies)
        ? data.similarMovies
        : [];

      renderMovie(movie, similarMovies);

    } catch (error) {
      console.error("CineVault Movie Error:", error);

      showError(
        "Unable to Load Movie",
        "Something went wrong while loading movie details. Please refresh the page and try again."
      );
    }
  }

  loadMovie();

})();
</script>

</body>
</html>
